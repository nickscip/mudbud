[project]
name = "glaze-etl"
version = "0.1.0"
description = "Scrapes commercial glaze manufacturer catalogs into a searchable appearance database for Mudbud"
requires-python = ">=3.12,<3.13"
dependencies = [
    "temporalio>=1.9",
    "httpx[http2]>=0.28",
    "selectolax>=0.3.27",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pillow>=11.1",
    "numpy>=2.2",
    "scipy>=1.15",
    "colour-science>=0.4.6",
    "scikit-learn>=1.6",
    "psycopg[binary,pool]>=3.2",
    "storage3>=0.11",
    "structlog>=25.1",
    "typer>=0.15",
]

[project.scripts]
glaze-etl = "glaze_etl.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glaze_etl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
# Constructors accept what pydantic actually coerces, so passing a str to an HttpUrl
# field type-checks the same way it behaves at runtime.
init_typed = false
warn_required_dynamic_aliases = true
# Third-party packages without bundled stubs.
[[tool.mypy.overrides]]
module = ["selectolax.*", "colour.*", "sklearn.*", "scipy.*", "storage3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
