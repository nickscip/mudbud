name: CI

# Everything that can be checked without credentials or network access to the manufacturer.
# The pure stages are the bulk of the pipeline and run against checked-in fixtures, so this
# stays fast and needs no secrets — which also means it is safe on pull requests from forks.
#
# The database jobs spin up a real Postgres and replay the whole migration history into it, so a
# change to the schema is proven before any hosted project is touched. That ordering is the point:
# a migration applied to a hosted database is not something you can take back, and the app and the
# RPC signatures are hand-mirrored, so a mismatch is a runtime failure rather than a build error.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes — is there anything here CI can check?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Needs a merge base to diff against, which a shallow clone does not have.
          fetch-depth: 0

      - name: Classify the diff
        id: classify
        # Every job below is gated on this, so a documentation-only change spins up no
        # Postgres, installs no node_modules and bundles no app.
        #
        # Why a job-level `if:` and not `paths-ignore:` on the workflow. The four job names
        # here are *required status checks* on main. A workflow that path-filters itself out
        # never reports them at all, so they sit pending and the pull request can never be
        # merged — the branch protection failure mode that looks exactly like a hung CI. A
        # job skipped by `if:` still reports its name, with conclusion `skipped`, which
        # counts as passing. So the checks must stay reachable and decide for themselves.
        #
        # It fails open on purpose: no base to compare against, or nothing changed at all,
        # runs everything. Skipping CI wrongly is expensive to notice; running it wrongly
        # costs a few minutes.
        run: |
          set -euo pipefail
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --quiet origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}...HEAD"
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            range="${{ github.event.before }}..HEAD"
          else
            echo "no base to compare against — running everything"
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$range")"
          if [ -z "$changed" ]; then
            echo "no files in $range — running everything"
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed in $range:"
          echo "$changed" | sed 's/^/  /'

          # Documentation is anything no job reads: `docs/`, any markdown, the licence.
          # Note what is deliberately *not* on this list — `.github/` most of all, since a
          # change to CI itself has to run CI.
          if echo "$changed" | grep -qvE '(^docs/|\.md$|^LICENSE$)'; then
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "documentation only — skipping the rest"
            echo "code=false" >>"$GITHUB_OUTPUT"
          fi

  guards:
    name: Guards — append-only migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          # The check needs a merge base to compare against, which a shallow clone does not have.
          fetch-depth: 0

      - name: Migrations are append-only
        # Editing a migration that has already run somewhere forks the schema silently: a fresh
        # database gets the new text, an already-migrated one keeps the old, and CI passes either
        # way. The fix is always to add another migration.
        #
        # The base is the whole check, because it is what decides what "already run" means. Only
        # the default branch reaches deploy-schema.yml, so a migration that has not landed there
        # has not run anywhere and is still an ordinary file — editing it in response to review is
        # how a migration is supposed to be written. `origin/main` is therefore the base for every
        # branch, and three-dot against the merge base keeps migrations added to main since this
        # branch started from reading as local edits.
        #
        # The exception is a push to main itself, where comparing against origin/main compares the
        # branch to itself and the check could never fire on the one branch where an edited
        # migration has certainly already run. There, and only there, the base is what main pointed
        # at before the push.
        run: |
          default="${{ github.event.repository.default_branch }}"
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --quiet origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          elif [ "${{ github.ref_name }}" = "$default" ] \
               && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            base="${{ github.event.before }}"
          else
            # Also the fallback for a push to main whose `before` this clone cannot reach — a
            # brand-new branch has none at all, and a force-push may name history that is gone.
            git fetch --quiet origin "$default"
            base="origin/$default"
          fi
          scripts/check-migrations-append-only.sh "$base"

  etl:
    name: ETL — lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: etl

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: etl/uv.lock

      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy --strict glaze_etl

      - name: Give the integration tests a schema to talk to
        working-directory: .
        env:
          PGPASSWORD: postgres
        run: scripts/apply-migrations.sh postgres://postgres:postgres@localhost:5432/postgres

      - name: Start a transaction-mode PgBouncer for lock tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pgbouncer
          mkdir -p "$RUNNER_TEMP/pgbouncer"
          tee "$RUNNER_TEMP/pgbouncer/userlist.txt" >/dev/null <<'EOF'
          "postgres" "postgres"
          EOF
          tee "$RUNNER_TEMP/pgbouncer/pgbouncer.ini" >/dev/null <<EOF
          [databases]
          postgres = host=127.0.0.1 port=5432 dbname=postgres user=postgres password=postgres

          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6433
          auth_type = plain
          auth_file = $RUNNER_TEMP/pgbouncer/userlist.txt
          pool_mode = transaction
          default_pool_size = 5
          idle_transaction_timeout = 1.0
          logfile = $RUNNER_TEMP/pgbouncer/pgbouncer.log
          pidfile = $RUNNER_TEMP/pgbouncer/pgbouncer.pid
          unix_socket_dir = $RUNNER_TEMP/pgbouncer
          EOF
          pgbouncer -d "$RUNNER_TEMP/pgbouncer/pgbouncer.ini"
          for attempt in {1..20}; do
            if PGPASSWORD=postgres psql \
              postgres://postgres@127.0.0.1:6433/postgres \
              -v ON_ERROR_STOP=1 -Atqc 'select 1' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/pgbouncer/pgbouncer.log"
          exit 1

      - name: Tests
        # TEST_SUPABASE_DB_URL is what takes SnapshotStore's Postgres tests out of skip: they were
        # written against a real database and then never ran in CI, so the store's behaviour was
        # only ever verified in memory. The Storage tests stay skipped — they need the Supabase
        # Storage service, which a bare Postgres container is not.
        env:
          TEST_SUPABASE_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
          TEST_PGBOUNCER_DB_URL: postgres://postgres:postgres@127.0.0.1:6433/postgres
        # --cov-fail-under lives here rather than in pyproject: a local run without the DSN above
        # skips the Postgres-backed tests, so a threshold in the config would fail a green
        # developer suite. Branch coverage is on (see [tool.coverage.run]), which is what stops a
        # happy path from reading as though it had exercised every refusal it walked past.
        run: uv run pytest -q --cov=glaze_etl --cov-report=term-missing --cov-fail-under=90

  schema:
    name: Schema — migrations and SQL contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.code == 'true'

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]

    steps:
      - uses: actions/checkout@v4

      - name: Replay every migration and assert the contract
        # A *bare* Postgres, not Supabase. That is the point: it caught a grants migration that
        # assumed the `anon` role exists, which is true only on Supabase. The privilege assertions
        # in contract.sql skip themselves here for that reason and run locally against
        # `supabase start`, where the role does exist.
        #
        # The major version is pinned to match the Supabase stack rather than left on whatever is
        # convenient. Server versions disagree about catalog output — pg_get_function_identity_
        # arguments() includes parameter names on 17 and not on older releases, which is why
        # contract.sql compares oidvectortypes() instead — and testing on a version nothing runs
        # only proves the schema works somewhere nobody deploys.
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: scripts/verify-schema.sh

  app:
    # The name is a *required status check* on main, so it is left exactly as it was even though
    # the middle step now runs the whole Jest suite rather than only the device database.
    # Renaming it would retire the required check under its old name: it would never report,
    # sit pending forever, and no pull request could merge — the same failure the `changes`
    # job's comment describes. Rename it and the branch ruleset together, or not at all.
    name: App — typecheck, device DB, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # One source for the version, shared with anyone running nvm locally. The floor is
          # 22.13: the expo-sqlite double runs on `node:sqlite`, unflagged there.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        # Covers the test tree and __mocks__ too, so a mock that drifts from the module it
        # stands in for fails here rather than passing a test against a fiction.
        run: npx tsc --noEmit

      - name: Tests
        # Jest over src/, gated at 90% of statements, lines, functions and branches. The device
        # database's upgrade path — the least reachable and most destructive code in src/db,
        # since it only runs on a phone that installed the app before the change — is in here,
        # running its real statements against an in-memory node:sqlite.
        run: npm test -- --ci --coverage

      - name: Bundle
        # Proves the app actually builds, which a typecheck alone does not — it is where a
        # bad Metro config or a missing native module shows up.
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npx expo export --platform ios --output-dir /tmp/expo-export
